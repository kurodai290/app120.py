<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stable CEO Simulator</title>
    <style>
        body { background: #121214; color: #e0e0e6; font-family: monospace; padding: 20px; }
        h1, h2, h3 { color: #00ff66; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; border-radius: 5px; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: #22c55e; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #4ade80; }
        button.danger { background: #ef4444; color: #fff; }
        .log-box { background: #000; color: #00ff66; padding: 10px; height: 150px; overflow-y: scroll; font-size: 13px; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>👔 Stable CEO Simulator</h1>
    
    <div class="card" style="border-left: 5px solid #00ff66; margin-bottom: 20px;">
        <strong>【今月の世界情勢イベント】</strong>
        <p id="event-text">安定した市場環境です。</p>
    </div>

    <div class="grid">
        <!-- 財務ボード -->
        <div class="card">
            <h2>📊 経営指標</h2>
            <p><strong>ゲーム内時間:</strong> <span id="lbl-term">1</span> ヶ月目</p>
            <p><strong>手元現金 (Cash):</strong> <span id="lbl-cash">2,000,000</span> 円</p>
            <p><strong>原材料在庫 (Raw Materials):</strong> <span id="lbl-raw">0</span> 単位</p>
            <p><strong>製品在庫 (Inventory):</strong> <span id="lbl-product">0</span> 個</p>
            <hr style="border-color:#333;">
            <p><strong>自社ブランド認知度:</strong> <span id="lbl-brand">10</span> %</p>
            <p><strong>社員数:</strong> <span id="lbl-staff">1</span> 名</p>
            <p><strong>社員の不満度:</strong> <span id="lbl-stress">0</span> %</p>
            <p><strong>為替レート:</strong> 1ドル = <span id="lbl-fx">150</span> 円</p>
        </div>

        <!-- 経営戦略コマンド -->
        <div class="card">
            <h2>🏢 経営意思決定（コマンド）</h2>
            
            <h3>【1. サプライチェーン】</h3>
            <div class="btn-group">
                <button id="btn-buy">原材料を海外から仕入れる (100ドル/単位)</button>
                <button id="btn-make">製品を製造する (要:原材料1)</button>
            </div>

            <h3>【2. マーケティング & 人事】</h3>
            <div class="btn-group">
                <button id="btn-adv">広告費を投入する (300,000円 / 認知度+15%)</button>
                <button id="btn-hire">求人募集・社員を1名採用する</button>
                <button id="btn-care">福利厚生を強化する (150,000円 / 不満度-20%)</button>
            </div>

            <h3>【3. ターン進行】</h3>
            <div class="btn-group">
                <button id="btn-next" class="danger" style="padding: 15px 30px; font-size: 16px;">⏱ 決算を行い、翌月へ進む</button>
            </div>
        </div>
    </div>

    <div style="margin-top: 20px;" class="card">
        <h2>📜 社内CEO業務日誌</h2>
        <div id="log" class="log-box"></div>
    </div>

    <!-- ここからプログラム（HTMLの読み込みエラー対策として一番下に配置） -->
    <script>
        // データ変数
        let cash = 2000000;
        let rawMaterials = 0;
        let products = 0;
        let brandRecognition = 10; 
        let staffCount = 1;
        let staffStress = 0; 
        let term = 1;
        let fxRate = 150; 
        let baseProductPrice = 12000; 

        // ログ記録
        function logAction(text) {
            let logBox = document.getElementById("log");
            logBox.innerHTML += text + "<br>";
            logBox.scrollTop = logBox.scrollHeight; 
        }

        // 表示の更新
        function updateUI() {
            document.getElementById("lbl-term").innerText = term;
            document.getElementById("lbl-cash").innerText = cash.toLocaleString();
            document.getElementById("lbl-raw").innerText = rawMaterials;
            document.getElementById("lbl-product").innerText = products;
            document.getElementById("lbl-brand").innerText = brandRecognition;
            document.getElementById("lbl-staff").innerText = staffCount;
            document.getElementById("lbl-stress").innerText = staffStress;
            document.getElementById("lbl-fx").innerText = fxRate;
        }

        // --- 各ボタンの動作登録（エラー対策方式） ---
        
        // 仕入れ
        document.getElementById("btn-buy").addEventListener("click", function() {
            let costInYen = Math.round(100 * fxRate); 
            if (cash >= costInYen) {
                cash -= costInYen;
                rawMaterials += 1;
                logAction("[購買] 原材料を仕入れました。費用: " + costInYen.toLocaleString() + "円");
                updateUI();
            } else { alert("現金が不足しています！"); }
        });

        // 製造
        document.getElementById("btn-make").addEventListener("click", function() {
            if (rawMaterials >= 1) {
                rawMaterials -= 1;
                products += 1;
                logAction("[製造] 製品を1個製造しました。");
                updateUI();
            } else { alert("原材料がありません！"); }
        });

        // 広告
        document.getElementById("btn-adv").addEventListener("click", function() {
            if (cash >= 300000) {
                cash -= 300000;
                brandRecognition = Math.min(100, brandRecognition + 15);
                logAction("[宣伝] 広告によりブランド認知度が15%向上。");
                updateUI();
            } else { alert("広告費が足りません！"); }
        });

        // 採用
        document.getElementById("btn-hire").addEventListener("click", function() {
            if (cash >= 100000) { 
                cash -= 100000;
                staffCount += 1;
                logAction("[人事] 新規社員を1名採用しました。(計 " + staffCount + "名)");
                updateUI();
            } else { alert("採用資金が足りません。"); }
        });

        // 福利厚生
        document.getElementById("btn-care").addEventListener("click", function() {
            if (cash >= 150000) {
                cash -= 150000;
                staffStress = Math.max(0, staffStress - 20);
                logAction("[労務] 社員福利厚生を強化。不満度-20%");
                updateUI();
            } else { alert("資金が足りません。"); }
        });

        // 翌月進行
        document.getElementById("btn-next").addEventListener("click", function() {
            logAction("--- 【" + term + "ヶ月目 決算報告】 ---");

            // 販売
            let maxSales = Math.floor((brandRecognition / 100) * 5) + 1; 
            let actualSales = Math.min(products, maxSales);
            if (actualSales > 0) {
                let salesRevenue = actualSales * baseProductPrice;
                cash += salesRevenue;
                products -= actualSales;
                logAction("[営業] 製品が " + actualSales + " 個売れ、売上 " + salesRevenue.toLocaleString() + "円。");
            } else if (products > 0) {
                logAction("[営業] 認知度が低く売上ゼロ。");
            }

            // 固定費
            let salaryCost = staffCount * 250000;
            let officeRent = 150000;
            let totalFixedCost = salaryCost + officeRent;
            cash -= totalFixedCost;
            logAction("[財務] 固定費引き落とし: " + totalFixedCost.toLocaleString() + "円。");

            // 不満蓄積
            if (staffCount > 0) { staffStress = Math.min(100, staffStress + 8); }

            // 倒産判定
            if (cash < 0) {
                alert("【倒産】手元現金が底をつきました。ゲームオーバーです。");
                location.reload();
                return;
            }

            // ランダムイベント
            let rand = Math.random();
            let eventText = document.getElementById("event-text");
            if (rand < 0.25) {
                fxRate = 165; 
                eventText.innerText = "【円安進行】1ドル=165円。仕入れコスト上昇中！";
                eventText.style.color = "#ff3333";
            } else if (rand < 0.5) {
                fxRate = 120; 
                eventText.innerText = "【円高進行】1ドル=120円。仕入れの大チャンス！";
                eventText.style.color = "#00ff66";
            } else if (rand < 0.7 && staffStress > 50) {
                let penalty = staffCount * 200000;
                cash -= penalty;
                staffStress = 10;
                eventText.innerText = "【労務監督署ガサ入れ】罰金 " + penalty.toLocaleString() + "円。";
                eventText.style.color = "#ff3333";
            } else {
                fxRate = 150;
                eventText.innerText = "安定した市場環境です。";
                eventText.style.color = "#e0e0e6";
            }

            term += 1;
            updateUI();
        });

        // 初回起動
        updateUI();
        logAction("[システム] 経営シミュレータが起動しました。手元資金200万円。");
    </script>
</body>
</html>
